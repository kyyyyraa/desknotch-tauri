[package]
name = "desknotch"
version = "1.0.5"
description = "DeskNotch desktop assistant"
authors = ["DeskNotch Team"]
edition = "2021"

[lib]
name = "desknotch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
base64 = "0.22"
windows = { version = "0.58", features = [
    "Media_SpeechSynthesis",
    "Media_Ocr",
    "Media_Control",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi"
] }
windows-sys = { version = "0.59", features = [
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Registry"
] }
cpal = "0.15"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# Crate windows TERPISAH versi baru HANYA untuk TryChangeTimelinePositionAsync
# (seek SMTC) — 0.58 yang dipakai smtc/privacy/ocr tidak disentuh.
windows61 = { package = "windows", version = "0.61", features = [
    "Media_Control",
    "Foundation",
] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = false
panic = "abort"

